name: PianobarGUI
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  PianobarCore:
    path: Packages/PianobarCore
targets:
  PianobarGUI:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: PianobarCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Orpheus
        CFBundleName: Orpheus
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: "14.0"
    settings:
      base:
        PRODUCT_NAME: Orpheus
        PRODUCT_BUNDLE_IDENTIFIER: org.pianobar-gui.PianobarGUI
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: YES
        # Signed with a stable, self-signed local identity rather than ad-hoc.
        # Ad-hoc signing gives the app a designated requirement of a bare code
        # hash, which changes on every build — so macOS treats each reinstall
        # as a different app and the keychain stops handing over the saved
        # Pandora credentials. Run scripts/make-signing-cert.sh once to create
        # it; install.sh falls back to ad-hoc if it's missing.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Orpheus Code Signing"
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: 5.9
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

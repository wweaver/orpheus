name: PianobarGUI
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  PianobarCore:
    path: Packages/PianobarCore
targets:
  PianobarGUI:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    dependencies:
      - package: PianobarCore
      - target: OrpheusWidget
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Orpheus
        CFBundleName: Orpheus
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: "14.0"
    settings:
      base:
        PRODUCT_NAME: Orpheus
        PRODUCT_BUNDLE_IDENTIFIER: org.pianobar-gui.PianobarGUI
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: YES
        # Ad-hoc by default so a fresh clone builds anywhere, including
        # straight from Xcode. install.sh overrides this with the stable
        # "Orpheus Code Signing" identity when that certificate is present —
        # see scripts/make-signing-cert.sh for why that matters.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: 5.9
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # WidgetKit extension backing the desktop widget. Sandboxed (WidgetKit
  # requires it) and sharing only the app group container with the app; see
  # Shared/OrpheusShared.swift for how state and commands cross the boundary.
  OrpheusWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Orpheus
        CFBundleName: OrpheusWidget
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        # xcodegen *generates* Widget/Info.plist from this block, so the
        # extension point has to be declared here — a hand-written plist at
        # that path gets overwritten on the next `xcodegen generate`.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: OrpheusWidget
        PRODUCT_BUNDLE_IDENTIFIER: org.pianobar-gui.PianobarGUI.OrpheusWidget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: 5.9
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SKIP_INSTALL: YES
